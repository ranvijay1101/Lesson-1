<!DOCTYPE html>
<head>
    <title>Methods Examples</title>
</head>
<body>
    <h2>String Methods</h2>
    <p id="demo"></p>
    <script>
        let text ="Hello World!"
        let upper = text.toUpperCase()
        let lower = text.toLowerCase()
        let len = text.length
        let slice = text.slice(0,5)
        document.getElementById("demo").innerHTML = upper + "<br>" + lower + "<br>" + len + "<br>" + slice
    </script>
</body>
</html>
