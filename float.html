<!DOCTYPE html>

<head>

    <title>Float in CSS</title>
    <style>
        .box-1{
            width: 200px;
            height: 200px;
            background-color: aqua;
            float: left;
        }
        .box-2{
            width: 200px;
            height: 200px;
            background-color: orange;
            float: right;
        }
        .img{
            float: left;
            margin-right: 20px;
        }
    </style>
</head>
<body>
    <div class="box-1">Box 1</div>
    <div class="box-2">Box 2</div>

    <img src="Science.png" alt="">
    <p>This paragraph text will wrap around the image because we used float property in CSS</p>
</body>
</html>
