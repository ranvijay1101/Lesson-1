<!DOCTYPE html>
<head>
    <style>
        .underline{
            text-decoration: underline;
        }
        .line{
            text-decoration: line-through;
        }
        a{
            text-decoration: none;
        }
        .upper{}

    </style>
    <title>Text decoration in CSS.</title>
</head>
<body>
    <p class="undeline">This text is underlined.</p>
    <p class="line">This text has a line through.</p>
    <a href="#">This is a link.</a>

    <p class="upper">This will become capital.</p>
    <p class="cap">This will capitalize the first letter.</p>
</body>
</html>
