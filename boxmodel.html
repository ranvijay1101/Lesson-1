<!DOCTYPE html>


<head>
    <title>Box Model</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: red;
            border: 5px solid orange;
            padding: 20px;
            margin: 20px;
        }
        .box2{
            width: 200px;
            height: 200px;
            background-color: aqua;
            border: 5px solid orange;
            padding: 50px;
            margin: 20px;
        }
    </style>
</head>
<body>
  <div class="box">This is a box</div>
  <div class="box2">This is another box</div>  
</body>
</html>
