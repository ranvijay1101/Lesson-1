<!DOCTYPE html>
<head>
    <title>Formating In HTML</title>
</head>
<body>
    <p><b>This is a bold tag.</b></p>
    <p><i>This is an italic tag.</i></p>
    <p><u>This is an underline tag.</u></p>
    <p><strong>This is a strong tag.</strong></p>
    <p><em>This is an emphasise tag.</em></p>
</body>
</html>
