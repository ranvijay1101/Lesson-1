<!DOCTYPE html>
<head>
    <title>Introduction to CSS.</title>
    <style>
        h1 {
            color: aquamarine;
        }
    </style>
</head>
<body>
 <p style="color: blueviolet;">This is a paragraph.</p>   
 <h1>This is an example of internal CSS.</h1>
 <h2>This is an example of external CSS.</h2>
 <p class="text">This is an example of a class selector.</p>
 <p id="paragraph">This is an example of ID selector.</p>
</body>
</html>
