<!DOCTYPE html>
<head>
    <title>Positioning in CSS</title>
    <style>
        div{
            position: static;
            border: 2px soid black;
        }
        .box{
            position: relative;
            top: 20px;
            left: 50px;
            border: 2px solid red;
            width: 200px;
        }
        .parent{
            position: relative;
            top: 20px;
            left: 50px;
            width: 200px;
        }
    </style>
</head>
<body>
  <div>This is a static position</div>
  <div class="box"> Relative position</div> 
  <div class="parent">
    <div class="child">Absolute position</div>
  </div>
  <div class="fix box"> Fixed box</div>

  <div class="sticky">Sticky</div>
</body>
</html>
